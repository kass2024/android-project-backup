plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def posKeyFile = rootProject.file("pos.key")
def posKey = posKeyFile.exists() ? posKeyFile.getText("UTF-8").trim() : ""
def posKeyEscaped = posKey.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace 'com.xander.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xander.pos'
        minSdk 24
        targetSdk 28
        versionCode 17
        versionName '3.0.12'
        buildConfigField 'String', 'DEFAULT_BASE_URL', '"https://schoolmis.xanderglobalacademy.com/"'
        buildConfigField 'String', 'POS_KEY', "\"${posKeyEscaped}\""
    }

    signingConfigs {
        till {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.till
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // HFims VP530 + DK USB both ship libusb; keep one copy.
            pickFirsts += '**/libusb1.0.so'
            pickFirsts += '**/libusb100.so'
            pickFirsts += '**/libc++_shared.so'
        }
    }
}

// Vp530Demo ships R8-minified bytecode. dex2jar breaks ART verification, so we compile
// against a stub jar and inject a filtered original classes.dex into the APK.
def palmRuntimeDex = file('libs/hfims-palm-runtime.dex')
def injectPalmDexScript = file('scripts/inject_palm_dex.py')

android.applicationVariants.configureEach { variant ->
    variant.packageApplicationProvider.configure { packageTask ->
        packageTask.doLast {
            def outDir = packageTask.outputDirectory.get().asFile
            def apk = outDir.listFiles()?.find { it.name.endsWith('.apk') }
            if (apk == null || !apk.exists()) {
                def dir = file("${buildDir}/outputs/apk/${variant.name}")
                apk = dir.listFiles()?.find { it.name.endsWith('.apk') }
            }
            if (apk == null || !apk.exists()) {
                throw new GradleException("Could not locate packaged APK for ${variant.name}")
            }
            if (!palmRuntimeDex.exists()) {
                throw new GradleException("Missing ${palmRuntimeDex}")
            }
            def sdkDir = android.sdkDirectory
            def buildTools = file("${sdkDir}/build-tools").listFiles()?.findAll { it.isDirectory() }?.sort { it.name }?.reverse()?.find()
            if (buildTools == null) {
                throw new GradleException('Android build-tools not found')
            }
            exec {
                commandLine 'py', '-3', injectPalmDexScript.absolutePath,
                        apk.absolutePath,
                        palmRuntimeDex.absolutePath,
                        buildTools.absolutePath
            }
        }
    }
}

dependencies {
    implementation(group: '', name: 'dkcloudid-usb-android-module-v2.1.0', ext: 'aar')
    implementation files('libs/smdt.jar')
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Embedded Smart Pos X60 palm (Vp530Demo): native/assets AAR + compile stubs; runtime dex injected below.
    compileOnly files('libs/hfims-palm-compile.jar')
    implementation files('libs/hfims-palm-vp530.aar')
    implementation files('libs/PosSdkXzy1.2.3.0.aar')
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
