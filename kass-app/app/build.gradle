apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.qonics.somanet"
    compileSdk 36

    defaultConfig {
        applicationId "com.xandertech.smartsms"
        minSdk 21
        targetSdk 36
        versionCode 129
        versionName "4.3.102"
        vectorDrawables.useSupportLibrary = true
        // Real phones are ARM 32-bit or 64-bit. Drop the obsolete armeabi folder;
        // older Android installers refuse an APK that still contains it.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    signingConfigs {
        release {
        if (keystorePropertiesFile.exists()) {
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
        enableV1Signing true
        enableV2Signing true
        enableV3Signing true
        enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            // Compress native libraries so Android 5 and 6 can extract them.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "XnderTechSMS.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/dkcloudid-usb-android-module-v2.1.0.aar')

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'com.squareup.okio:okio:2.8.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.android.volley:volley:1.2.1'

    implementation 'com.github.f0ris.sweetalert:library:1.5.1'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'com.vanniktech:android-image-cropper:4.5.0'
    implementation 'de.hdodenhof:circleimageview:3.0.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.facebook.fresco:fresco:1.8.1'
    implementation 'com.github.permissions-dispatcher:permissionsdispatcher:4.9.2'
}
